name: Live free-review verification
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the bundled Action with one owned fixture and no wallet
        env:
          UPGRADELENS_VERIFICATION: "true"
        run: node scripts/live-fixture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-review-${{ github.run_id }}
          path: live-review-report.json
          retention-days: 30
